const quiz = document.getElementById("quiz");

questions.forEach((q, i)=>{
  const div = document.createElement("div");
  div.className="card";

  div.innerHTML = `
    <b>Q${i+1}. ${q.q}</b>
    ${q.o.map((opt,j)=>`
      <label class="option">
        <input type="radio" name="q${i}" value="${j}"> ${opt}
      </label>`).join("")}
    <div class="explanation" id="exp${i}"></div>
  `;

  quiz.appendChild(div);
});

function submitQuiz(){
  let score=0;

  questions.forEach((q,i)=>{
    const selected = document.querySelector(`input[name=q${i}]:checked`);
    const opts = document.getElementsByName(`q${i}`);

    opts.forEach((opt,j)=>{
      const parent = opt.parentElement;

      if(j===q.a) parent.classList.add("correct");
      if(selected && selected.value==j && j!==q.a) parent.classList.add("wrong");
    });

    if(selected && selected.value==q.a) score++;

    const exp = document.getElementById("exp"+i);
    exp.style.display="block";
    exp.innerHTML = "<b>Explanation:</b> "+q.e;
  });

  let percent = (score/questions.length)*100;

  document.getElementById("result").innerHTML = `
    <div class="card">
      🎯 Score: ${score}/${questions.length} (${percent.toFixed(1)}%)
      <br><br>
      ${percent>80?"🔥 Interview Ready":
        percent>60?"⚠️ Improve":
        "❌ Need Practice"}
    </div>
  `;
}
